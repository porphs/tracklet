[package]
name = "tracklet"
version = "0.1.0"
description = "Tracklet: a personal, offline task tracker"
edition = "2021"

[lib]
name = "tracklet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
